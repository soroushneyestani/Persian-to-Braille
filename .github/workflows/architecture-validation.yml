name: Architecture Validation

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".node-version"
      - ".gitignore"
      - ".gitattributes"
      - "packages/**"
      - "docs/normalization/**"
      - "docs/translation/**"
      - "tools/normalization/**"
      - "tools/translation/**"
      - "conformance/**"
      - "docs/conformance/**"
      - "tools/conformance/**"
      - "apps/**"
      - "integrations/**"
      - "tools/architecture/**"
      - "docs/architecture/**"
      - "spec/fa-ir/profiles/**"
      - "spec/fa-ir/rules/**"
      - ".github/workflows/architecture-validation.yml"
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate v2 repository architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.21.0

      - name: Verify toolchain
        shell: bash
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(pnpm --version)" = "11.21.0"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate architecture contracts
        run: pnpm run validate:architecture

      - name: Validate Phase 4 normalization baseline
        run: pnpm run validate:normalization

      - name: Build workspace
        run: pnpm run build

      - name: Type-check workspace
        run: pnpm run typecheck

      - name: Validate compiled Core specification consumption
        run: pnpm run validate:runtime

      - name: Run workspace tests
        run: pnpm run test
      - name: Validate profile conformance
        run: pnpm run validate:conformance

      - name: Clean generated build artifacts
        run: pnpm run clean

      - name: Verify repository remains reproducible and clean
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
