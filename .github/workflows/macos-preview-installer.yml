name: Braille Hub macOS Preview Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "mac-preview-v*"

permissions:
  contents: write

jobs:
  build-macos-preview-installer:
    name: Build macOS preview PKG
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build public Microsoft 365 preview distribution
        env:
          OFFICE_ADDIN_PRODUCTION_BASE_URL: https://soroushneyestani.github.io/Persian-to-Braille
        run: |
          pnpm --filter @persian-braille/microsoft365 run build:marketplace
          node integrations/microsoft365/build-manual-preview.mjs

      - name: Build macOS PKG
        shell: bash
        run: |
          chmod +x integrations/microsoft365/release/macos/build-pkg.sh
          chmod +x integrations/microsoft365/release/macos/scripts/postinstall
          chmod +x integrations/microsoft365/release/macos/Braille-Hub-Mac-Uninstall.command

          bash integrations/microsoft365/release/macos/build-pkg.sh \
            "18.0.${GITHUB_RUN_NUMBER}"

      - name: Inspect package
        shell: bash
        run: |
          pkgutil --check-signature \
            integrations/microsoft365/release/macos/dist/Braille-Hub-Mac-Preview-Installer.pkg \
            || true

          pkgutil --payload-files \
            integrations/microsoft365/release/macos/dist/Braille-Hub-Mac-Preview-Installer.pkg

          cat integrations/microsoft365/release/macos/dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Braille-Hub-Mac-Preview-Installer
          path: integrations/microsoft365/release/macos/dist/*
          if-no-files-found: error

      - name: Create GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/mac-preview-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            integrations/microsoft365/release/macos/dist/* \
            --title "Braille Hub Mac Preview ${GITHUB_REF_NAME}" \
            --notes "Preview macOS installer for Braille Hub Microsoft 365 Add-in. This is a sideload test release, not Microsoft Marketplace publication. The package may be unsigned until Developer ID signing and Apple notarization are configured." \
            --prerelease