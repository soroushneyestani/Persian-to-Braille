name: Specification Validation

on:
  push:
    branches:
      - main
    paths:
      - "spec/**"
      - "docs/specification/**"
      - "tools/spec/**"
      - "requirements-spec.txt"
      - ".github/workflows/specification-validation.yml"
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: specification-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Persian Braille specification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-spec.txt

      - name: Install specification validator dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-spec.txt

      - name: Regenerate Phase 2 schemas
        run: python tools/spec/build_phase2_schemas.py

      - name: Regenerate normative promotion protocol
        run: python tools/spec/build_normative_promotion_protocol.py

      - name: Regenerate approved consensus promotion batch
        run: python tools/spec/build_consensus_promotion_batch.py

      - name: Regenerate Phase 2.11 review queue
        run: python tools/spec/build_review_queue.py

      - name: Validate Phase 2.11 review queue
        run: python tools/spec/validate_review_queue.py

      - name: Run Phase 2.11 review queue negative fixtures
        run: python tools/spec/test_review_queue_validator.py

      - name: Regenerate Phase 2.12 evidence packets
        run: python tools/spec/build_evidence_packets.py

      - name: Validate Phase 2.12 evidence packets
        run: python tools/spec/validate_evidence_packets.py

      - name: Run Phase 2.12 evidence packet negative fixtures
        run: python tools/spec/test_evidence_packet_validator.py

      - name: Regenerate Phase 2.13 adjudication plan
        run: python tools/spec/build_evidence_adjudication_plan.py

      - name: Validate Phase 2.13 adjudication plan
        run: python tools/spec/validate_evidence_adjudication_plan.py

      - name: Run Phase 2.13 adjudication plan negative fixtures
        run: python tools/spec/test_evidence_adjudication_plan_validator.py

      - name: Regenerate Phase 2.14 adjudication framework
        run: python tools/spec/build_adjudication_framework.py

      - name: Reproduce approved Phase 2.14 unresolved decision
        run: python tools/spec/record_batch00_adjudication.py

      - name: Reproduce approved Phase 2.14 implementation conflicts
        run: python tools/spec/record_implementation_conflicts.py

      - name: Reproduce approved Phase 2.14 implementation alignments
        run: python tools/spec/record_implementation_alignment.py

      - name: Materialize Phase 2.14 adjudication manifest
        run: python tools/spec/materialize_adjudications.py

      - name: Validate Phase 2.14 adjudications
        run: python tools/spec/validate_adjudications.py

      - name: Validate Phase 2.14 completion
        run: python tools/spec/validate_phase214_completion.py

      - name: Run Phase 2.14 adjudication negative fixtures
        run: python tools/spec/test_adjudication_validator_negative.py

      - name: Verify Phase 2.14 adjudication determinism
        run: python tools/spec/test_adjudication_determinism.py

      - name: Regenerate Phase 2 candidate package
        run: python tools/spec/build_phase2_candidate_package.py

      - name: Test promotion-aware materialization
        run: python tools/spec/test_promotion_aware_materialization.py

      - name: Validate specification package
        run: python tools/spec/validate_phase2_spec.py

      - name: Run specification validator negative fixtures
        run: python tools/spec/test_phase2_validator_negative.py

      - name: Validate normative promotion governance
        run: python tools/spec/validate_normative_promotions.py

      - name: Run promotion validator fixtures
        run: python tools/spec/test_normative_promotion_validator.py

      - name: Verify generated specification is reproducible
        run: |
          git diff --exit-code -- \
            docs/specification \
            spec/fa-ir/schema \
            spec/fa-ir/governance \
            spec/fa-ir/promotions \
            spec/fa-ir/rules \
            spec/fa-ir/conformance \
            spec/fa-ir/profiles \
            spec/fa-ir/manifests \
            spec/fa-ir/review \
            spec/fa-ir/adjudications \
            spec/fa-ir/validation
